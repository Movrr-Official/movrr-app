<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2c"><title>MOVRR Partner — Offline</title>
<style>
@font-face{font-family:Jakarta;src:url('/fonts/jakarta-400.ttf')}@font-face{font-family:Lexend;src:url('/fonts/lexend-700.ttf');font-weight:700}
:root{color-scheme:light;--bg:#f5f5f3;--surface:white;--ink:#181816;--muted:#545452;--accent:#086d35}
html.dark{color-scheme:dark;--bg:#061a10;--surface:#163c29;--ink:#f7fff5;--muted:#bac9bd;--accent:#bbefc8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.7 Jakarta,system-ui,sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}main{width:100%;max-width:30rem;padding:32px 24px;border-radius:32px;background:var(--surface)}.brand{color:var(--accent);font:700 16px Lexend,system-ui}h1{font:700 28px/1.3 Lexend,system-ui;margin:32px 0 16px;letter-spacing:-.03em}p{color:var(--muted)}a{display:flex;min-height:48px;align-items:center;justify-content:center;border-radius:999px;background:#086d35;color:white;text-decoration:none;margin-top:24px;padding:12px 20px;font-weight:600}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button{min-height:48px;border:0;background:none;color:var(--accent);font:inherit;padding:12px 0}small{display:block;color:var(--muted);margin-top:20px}
</style><script>
try{const t=localStorage.getItem('theme');document.documentElement.classList.toggle('dark',t==='dark'||((!t||t==='system')&&matchMedia('(prefers-color-scheme: dark)').matches))}catch{}
</script></head><body><main><div class="brand">MOVRR PARTNER</div><h1 id="title">You're offline</h1><p id="message">Reconnect before checking or handing over a reward. If a check was interrupted, review its status online before trying again.</p><p id="connection" role="status" aria-live="polite"></p><a id="retry" href="/dashboard">Try again</a><small id="privacy">No rewards can be validated or handed over offline.</small><button id="language" type="button" lang="nl">Nederlands</button></main>
<script>
const copy={en:["You're offline","Reconnect before checking or handing over a reward. If a check was interrupted, review its status online before trying again.","Try again","No rewards can be validated or handed over offline.","Your device reports a connection. Retry to check the reward status.","Nederlands"],nl:["Je bent offline","Maak verbinding voordat je een beloning controleert of overhandigt. Is een controle onderbroken? Bekijk de status online voordat je het opnieuw probeert.","Opnieuw proberen","Offline kun je geen beloningen controleren of overhandigen.","Je apparaat heeft verbinding. Probeer opnieuw om de status van de beloning te controleren.","English"]};
let locale='en',connectionChanged=false;try{if(localStorage.getItem('movrr-partner-language')==='nl')locale='nl'}catch{}
const ids=['title','message','retry','privacy'];
function render(){document.documentElement.lang=locale;const words=copy[locale];ids.forEach((id,i)=>document.getElementById(id).textContent=words[i]);document.getElementById('language').textContent=words[5];document.getElementById('language').lang=locale==='en'?'nl':'en';document.getElementById('connection').textContent=connectionChanged&&navigator.onLine?words[4]:'';document.title='MOVRR Partner — '+words[0]}
// The requested URL stays in the address bar. Never persist it or a private query.
document.getElementById('retry').href=location.pathname==='/dashboard'||location.pathname.startsWith('/dashboard/')?location.pathname:'/dashboard';
document.getElementById('language').onclick=()=>{locale=locale==='en'?'nl':'en';render()};window.addEventListener('online',()=>{connectionChanged=true;render()});window.addEventListener('offline',()=>{connectionChanged=false;render()});render();
</script></body></html>
